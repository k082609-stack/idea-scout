  .d-section{margin-bottom:32px}

  .d-evidence{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:6px 20px}
  .d-ev-row{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .d-ev-row:last-child{border-bottom:none}

</style>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo">サ</div>
      <div>
        <div class="brand-name">サキ<span>ヨミ</span><span class="beta">β版</span></div>
        <div class="brand-sub">次のビジネスを、条件で探す検索プラットフォーム</div>
      </div>
    </div>
    <a href="https://docs.google.com/forms/d/1X_OpuOFJRYWNsurQOi-rIFsvQO82GgUHQAYCDFuw6pY/viewform" target="_blank" rel="noopener" class="header-cta">💬 フィードバックを送る</a>
  </div>
</header>

<section class="hero">
  <h1>次の事業・ビジネスのアイデアを、<b>あなたの条件</b>で探す。</h1>
  <p>「起業したい」「副業を始めたい」「新規事業のネタが欲しい」——そんなあなたのために。国内外のビジネストレンドを収集し、費用・期間・収益モデルなどで絞り込める、ビジネストレンド検索プラットフォームです。</p>
</section>

<div class="layout">
  <aside class="panel">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
      条件で絞り込む
    </div>
    <div id="filters"></div>
    <button class="reset-btn" id="resetBtn">条件をリセット</button>
  </aside>

  <main>
    <div class="results-head">
      <div class="results-count"><b id="count">0</b> 件のアイデアが見つかりました</div>
      <button class="refresh-btn" id="refreshBtn">↻ 最新を取得</button>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-sheet">
    <div class="detail-bar">
      <button class="back-btn" id="backBtn">← 一覧に戻る</button>
      <button class="close-btn" id="closeBtn">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>

<script>
/* ============================================================================
   ★★★ ここだけ書き換えます ★★★
   下の "" の中に、Makeで控えた窓口URL（https://hook…make.com/…）を貼り付ける
   ============================================================================ */
const API_URL = "https://hook.eu1.make.com/8cimkblxmijdm8mkcgkredbawoh7d6jo";


/* ----------------------------------------------------------------------------
   ① 検索軸の設定（valueはAirtableの値とぴったり一致させてあります）
---------------------------------------------------------------------------- */
const FILTER_CONFIG = [
  { id:'cost', label:'初期費用', field:'初期費用', type:'select', options:[
    {value:'',label:'すべて'},{value:'〜10万円',label:'〜10万円（スモールスタート）'},
    {value:'10〜100万円',label:'10万〜100万円'},{value:'100万円以上',label:'100万円以上'} ]},
  { id:'target', label:'ターゲット', field:'ターゲット', type:'select', options:[
    {value:'',label:'すべて'},{value:'個人(BtoC)',label:'個人向け（BtoC）'},
    {value:'法人(BtoB)',label:'法人向け（BtoB）'},{value:'地域・店舗',label:'地域・店舗向け'} ]},
  { id:'skill', label:'必要なスキル', field:'必要スキル', type:'select', options:[
    {value:'',label:'すべて'},{value:'不要',label:'専門スキル不要'},
    {value:'IT・Web',label:'IT・Webスキル'},{value:'専門・資格',label:'専門知識・資格'},
    {value:'営業・接客',label:'営業・接客スキル'},{value:'クリエイティブ',label:'クリエイティブ（デザイン・動画など）'},
    {value:'調理・製造',label:'調理・製造スキル'},{value:'介護・医療',label:'介護・医療スキル'},
    {value:'語学',label:'語学スキル'} ]},
  { id:'period', label:'立ち上げ期間', field:'立ち上げ期間', type:'select', options:[
    {value:'',label:'すべて'},{value:'すぐ(1ヶ月以内)',label:'すぐ（1ヶ月以内）'},
    {value:'1〜6ヶ月',label:'1〜6ヶ月'},{value:'半年以上',label:'じっくり（半年以上）'} ]},
  { id:'model', label:'収益モデル', field:'収益モデル', type:'select', options:[
    {value:'',label:'すべて'},{value:'サブスク',label:'サブスク・継続課金'},
    {value:'物販',label:'物販・売り切り'},{value:'受託・サービス',label:'受託・サービス提供'} ]},
  { id:'heat', label:'注目度', field:'注目度', type:'select', options:[
    {value:'',label:'すべて'},{value:'急上昇',label:'🔥 急上昇'},
    {value:'注目',label:'📈 注目'},{value:'新着',label:'✨ 新着'} ]},
  { id:'keyword', label:'フリーワード', type:'text', placeholder:'例：AI、サブスク、シニア …' }
];

const HEAT_DISPLAY = {
  "急上昇":{cls:'hot',label:'🔥 急上昇'},
  "注目":{cls:'rising',label:'📈 注目'},
  "新着":{cls:'new',label:'✨ 新着'}
};

/* ② データは固定で持たず、起動時にAirtableからMature経由で取得する */
let IDEAS = [];

const state = {};
FILTER_CONFIG.forEach(f => state[f.id] = '');
const filtersEl = document.getElementById('filters');
const gridEl    = document.getElementById('grid');
const countEl   = document.getElementById('count');

/* タグは「、」区切りの文字列なので配列に直す */
function tagList(idea){
  const t = idea["タグ"] || "";
  return String(t).split("、").map(s=>s.trim()).filter(Boolean);
}

/* 出典：URLがあればリンクに、なければただの文字に */
function sourceCell(idea){
  const text = idea["出典"] || '-';
  const url  = idea["出典URL"] || '';
  if(url && /^https?:\/\//.test(url)){
    return `<a href="${url}" target="_blank" rel="noopener">${text} ↗</a>`;
  }
  return text;
}

/* ③ 窓口からデータを読み込む */
async function loadIdeas(){
  gridEl.innerHTML = `<div class="empty"><div class="spinner"></div>最新のアイデアを読み込み中…</div>`;
  countEl.textContent = "…";
  if(!API_URL || API_URL.indexOf("http") !== 0){
    gridEl.innerHTML = `<div class="empty"><b>窓口URLが未設定です</b>このファイルの上のほう、API_URL の "" の中に、Makeの窓口URLを貼り付けてください。</div>`;
    return;
  }
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    IDEAS = Array.isArray(data) ? data : [];
    renderResults();
  }catch(e){
    gridEl.innerHTML = `<div class="empty"><b>データを読み込めませんでした</b>窓口URLが正しいか、Make側のシナリオが「ON」になっているか確認してください。</div>`;
  }
}

function renderFilters(){
  filtersEl.innerHTML = FILTER_CONFIG.map(f=>{
    const control = f.type==='select'
      ? `<select data-id="${f.id}">${f.options.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select>`
      : `<input type="text" data-id="${f.id}" placeholder="${f.placeholder||''}">`;
    return `<div class="filter-group"><label class="filter-label">${f.label}</label>${control}</div>`;
  }).join('');
  filtersEl.querySelectorAll('[data-id]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change':'input';
    el.addEventListener(evt, e=>{
      state[e.target.dataset.id]=e.target.value;
      // GA4イベント：フィルター使用
      if(typeof gtag !== 'undefined' && e.target.value){
        gtag('event', 'filter_used', {
          'filter_type': e.target.dataset.id,
          'filter_value': e.target.value
        });
      }
      renderResults();
    });
  });
}

function matches(idea){
  return FILTER_CONFIG.every(f=>{
    const sel = state[f.id];
    if(!sel) return true;
    if(f.type==='text'){
      const hay = ((idea["タイトル"]||"")+(idea["要約"]||"")+tagList(idea).join(' ')).toLowerCase();
      return hay.includes(sel.toLowerCase());
    }
    return (idea[f.field]||"") === sel;
  });
}

function renderResults(){
  const HEAT_ORDER = {'新着':0,'急上昇':1,'注目':2};
  const hits = IDEAS.filter(matches).sort((a,b)=>{
    const oa = HEAT_ORDER[a["注目度"]] ?? 3;
    const ob = HEAT_ORDER[b["注目度"]] ?? 3;
    return oa - ob;
  });
  countEl.textContent = hits.length;
  if(hits.length===0){
    gridEl.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <b>条件に合うアイデアが見つかりませんでした</b>条件をゆるめるか、リセットしてお試しください。</div>`;
    return;
  }
  gridEl.innerHTML = hits.map((idea,i)=>{
    const realIdx = IDEAS.indexOf(idea);
    const h = HEAT_DISPLAY[idea["注目度"]] || {cls:'new',label:idea["注目度"]||''};
    return `
    <article class="card" data-idx="${realIdx}" style="animation-delay:${i*60}ms">
      <div class="card-top"><span class="heat ${h.cls}">${h.label}</span></div>
      <h3>${idea["タイトル"]||''}</h3>
      <p class="card-desc">${idea["要約"]||''}</p>
      <div class="spec">
        <div class="spec-item"><span class="k">初期費用</span><span class="v">${idea["初期費用目安"]||idea["初期費用"]||'-'}</span></div>
        <div class="spec-item"><span class="k">立ち上げ期間</span><span class="v">${idea["立ち上げ期間"]||'-'}</span></div>
        <div class="spec-item"><span class="k">粗利率の目安</span><span class="v">${idea["粗利率"]||'-'}</span></div>
        <div class="spec-item"><span class="k">市場規模</span><span class="v">${idea["市場規模"]||'-'}</span></div>
        <div class="spec-item"><span class="k">ターゲット</span><span class="v">${idea["ターゲット"]||'-'}</span></div>
        <div class="spec-item"><span class="k">収益モデル</span><span class="v">${idea["収益モデル"]||'-'}</span></div>
      </div>
      <div class="evidence">
        <div class="ev-title">📊 トレンドの根拠・実績</div>
        <div class="ev-row"><span class="ev-k">出典</span><span class="ev-v">${idea["出典"]||'-'}</span></div>
        <div class="ev-row"><span class="ev-k">競合</span><span class="ev-v">${idea["競合"]||'-'}</span></div>
        <div class="ev-row"><span class="ev-k">成功事例</span><span class="ev-v">${idea["成功事例"]||'-'}</span></div>
      </div>
      <div class="tags">${tagList(idea).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
      <div class="card-more">詳細を見る <span>→</span></div>
    </article>`;
  }).join('');
}

/* 詳細画面 */
const overlay   = document.getElementById('detailOverlay');
const detailBody= document.getElementById('detailBody');
function openDetail(idx){
  const idea = IDEAS[idx];
  if(!idea) return;
  // GA4イベント：カード詳細を開いた
  if(typeof gtag !== 'undefined'){
    gtag('event', 'card_detail_open', {
      'idea_title': idea["タイトル"] || '',
      'idea_category': idea["ターゲット"] || ''
    });
  }
  const h = HEAT_DISPLAY[idea["注目度"]] || {cls:'new',label:idea["注目度"]||''};
  detailBody.innerHTML = `
    <div class="d-top">
      <span class="heat ${h.cls}">${h.label}</span>
      <div class="d-tags">${tagList(idea).map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
    </div>
    <h1 class="d-title">${idea["タイトル"]||''}</h1>
    <p class="d-lead">${idea["要約"]||''}</p>
    <div class="d-specs">
      <div class="d-spec"><div class="k">初期費用</div><div class="v">${idea["初期費用目安"]||idea["初期費用"]||'-'}</div></div>
      <div class="d-spec"><div class="k">立ち上げ期間</div><div class="v">${idea["立ち上げ期間"]||'-'}</div></div>
      <div class="d-spec"><div class="k">粗利率の目安</div><div class="v">${idea["粗利率"]||'-'}</div></div>
      <div class="d-spec"><div class="k">ターゲット</div><div class="v">${idea["ターゲット"]||'-'}</div></div>
      <div class="d-spec"><div class="k">収益モデル</div><div class="v">${idea["収益モデル"]||'-'}</div></div>
      <div class="d-spec"><div class="k">市場規模</div><div class="v">${idea["市場規模"]||'-'}</div></div>
    </div>
    <div class="d-section">
      <h2>このビジネスの解説</h2>
      <p>${idea["詳細本文"]||idea["要約"]||''}</p>
    </div>
    <div class="d-section">
      <h2>📊 トレンドの根拠・実績</h2>
      <div class="d-evidence">
        <div class="d-ev-row"><div class="k">出典</div><div class="v">${sourceCell(idea)}</div></div>
        <div class="d-ev-row"><div class="k">競合状況</div><div class="v">${idea["競合"]||'-'}</div></div>
        <div class="d-ev-row"><div class="k">成功事例</div><div class="v">${idea["成功事例"]||'-'}</div></div>
      </div>
    </div>
    <div class="d-cta">
      <p>サキヨミはβ版です。あなたの声がサキヨミを育てます。<br>「こんな機能がほしい」「このアイデアが見たい」など、率直なフィードバックをお待ちしています。</p>
      <button onclick="window.open('https://docs.google.com/forms/d/1X_OpuOFJRYWNsurQOi-rIFsvQO82GgUHQAYCDFuw6pY/viewform','_blank')">💬 フィードバックを送る（無料・1分）</button>
    </div>`;
  overlay.classList.add('open');
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeDetail(){ overlay.classList.remove('open'); document.body.style.overflow=''; }

gridEl.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(card && card.dataset.idx!=null) openDetail(Number(card.dataset.idx));
});
document.getElementById('backBtn').addEventListener('click', closeDetail);
document.getElementById('closeBtn').addEventListener('click', closeDetail);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeDetail(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  FILTER_CONFIG.forEach(f=>state[f.id]='');
  renderFilters(); renderResults();
});
document.getElementById('refreshBtn').addEventListener('click', loadIdeas);

/* 起動 */
renderFilters();
loadIdeas();
</script>
</body>
</html>
